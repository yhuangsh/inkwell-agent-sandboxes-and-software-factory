# sssf.app.yaml — what inkwell needs from a blank exeuntu VM.
#
# The provisioner (sandbox_mount/guest/provision.sh step 5) reads `runtime`,
# `install`, and `build`; the quality layer (adws/adw_modules/quality.py) reads
# `checks`. Nothing here is inkwell-specific machinery — it is the app declaring
# its own needs so the factory stays byte-identical across apps. No apt, ever:
# `runtime` names a toolchain the image / provision steps already provide.
runtime: bun
install:
  - bun install
build: []
serve:
  command: bun run server.ts
  port: 4501
  health_path: /
checks:
  # argv paths are relative to the app dir (checks run with cwd = the app dir).
  # `{outdir}` is substituted by quality.py with the check's absolute artifact
  # bundle dir (<context_handoff>/quality/NN_<name>/bundle), so builds never
  # write into the app tree and gate A stays clean.
  - name: frontend_lint
    area: frontend
    operation: lint
    argv: [bun, x, oxlint@1.36.0, public/app.js]
  - name: backend_lint
    area: backend
    operation: lint
    argv: [bun, x, oxlint@1.36.0, server.ts]
  - name: frontend_typecheck
    area: frontend
    operation: typecheck
    argv: [bun, build, --target=browser, public/app.js, --outdir, "{outdir}"]
  - name: backend_typecheck
    area: backend
    operation: typecheck
    argv: [bun, build, --target=bun, server.ts, --outdir, "{outdir}"]
  - name: frontend_build
    area: frontend
    operation: build
    argv: [bun, build, --target=browser, --minify, public/app.js, --outdir, "{outdir}"]
  - name: backend_build
    area: backend
    operation: build
    argv: [bun, build, --target=bun, --minify, server.ts, --outdir, "{outdir}"]
  - name: tests
    area: backend
    operation: build           # the QualityOperation enum has no "test"; the name carries it
    argv: [bun, test, server.test.ts]
    timeout_seconds: 600
